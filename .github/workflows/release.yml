name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # 推送到 main 时检查 Cargo.toml 版本号:
    # 对应的 v* tag 不存在(版本变了)→ 打 tag 并发布;已存在 → 跳过
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml 中的版本号无效: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "版本未变化($TAG 已存在),跳过发布"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到新版本 $TAG"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync lockfile and verify
        if: steps.version.outputs.changed == 'true'
        run: cargo check

      - name: Commit and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            git tag "$TAG"
            git push origin "$TAG"
          else
            git commit -m "chore: release $TAG"
            git tag "$TAG"
            git push origin main "$TAG"
          fi

  build:
    needs: release
    if: needs.release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: paseo-relay-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            artifact: paseo-relay-aarch64-linux
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "${{ matrix.artifact }}.tar.gz" paseo-relay
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          mv "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}.tar.gz.sha256" "${{ runner.temp }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/${{ matrix.artifact }}.tar.gz
            ${{ runner.temp }}/${{ matrix.artifact }}.tar.gz.sha256

  publish:
    needs: [release, build]
    if: needs.release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        working-directory: dist
        run: |
          cat *.tar.gz.sha256 > checksums-sha256.txt
          rm *.tar.gz.sha256
          cat checksums-sha256.txt

      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "paseo-relay $TAG" \
            --generate-notes \
            *.tar.gz checksums-sha256.txt
